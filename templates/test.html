<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নগরবাসী এক্সপ্রেস - টেস্ট</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center">
                        <h2>নাগরীবাসী এক্সপ্রেস</h2>
                        <p class="mb-0">সার্ভার সফলভাবে চালু হয়েছে!</p>
                    </div>
                    <div class="card-body text-center">
                        <div class="alert alert-success">
                            <h4>✅ সার্ভার স্ট্যাটাস: চালু</h4>
                            <p>আপনার Django সার্ভার সফলভাবে চালু হয়েছে।</p>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-body">
                                        <h5>🏠 হোম পেজ</h5>
                                        <a href="/" class="btn btn-primary">হোম পেজ দেখুন</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-body">
                                        <h5>👨‍💼 অ্যাডমিন প্যানেল</h5>
                                        <a href="/admin/" class="btn btn-success">অ্যাডমিন প্যানেল</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <h5>লগইন তথ্য:</h5>
                            <p><strong>ইউজারনেম:</strong> admin</p>
                            <p><strong>পাসওয়ার্ড:</strong> admin123</p>
                        </div>
                        
                        <div class="mt-4">
                            <h5>সার্ভার তথ্য:</h5>
                            <p><strong>URL:</strong> http://127.0.0.1:8000/</p>
                            <p><strong>স্ট্যাটাস:</strong> <span class="text-success">চালু</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
